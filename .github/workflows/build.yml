name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_ubuntu:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - uses: actions/checkout@v4.2.2

      - name: Build setup
        run: ./setup-build.sh
      
      - name: Build
        id: build
        run: ./build.sh
        
      - name: Upload package
        uses: actions/upload-artifact@v4.5.0
        with:
          name: binary_package_ubuntu
          path: upload/*

      - name: Upload DOWNLOADS.txt
        uses: actions/upload-artifact@v4.5.0
        with:
          name: downloads-info-Ubuntu
          path: DOWNLOADS.txt

      - name: Upload downloads
        uses: actions/upload-artifact@v4.5.0
        with:
          name: downloads-Ubuntu
          path: downloads

    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      artifact_sha256: ${{ steps.build.outputs.artifact_sha256 }}

  # Sign in a separate job to limit ID token exposure
  sign_ubuntu:
    needs: [build_ubuntu]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.build_ubuntu.outputs.artifact_name }}
          subject-digest: sha256:${{ needs.build_ubuntu.outputs.artifact_sha256 }}

  build_macos:
    runs-on: macos-13

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - uses: actions/checkout@v4.2.2

      - name: Build setup
        run: ./setup-build.sh
      
      - name: Build
        id: build
        run: ./build.sh
        
      - name: Upload Package
        uses: actions/upload-artifact@v4.5.0
        with:
          name: binary_package_macos
          path: upload/*

      - name: Upload DOWNLOADS.txt
        uses: actions/upload-artifact@v4.5.0
        with:
          name: downloads-info-MacOS
          path: DOWNLOADS.txt

      - name: Upload downloads
        uses: actions/upload-artifact@v4.5.0
        with:
          name: downloads-MacOS
          path: downloads
        
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      artifact_sha256: ${{ steps.build.outputs.artifact_sha256 }}
      
  # Sign in a separate job to limit ID token exposure
  sign_macos:
    needs: [build_macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      
    steps:
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.build_macos.outputs.artifact_name }}
          subject-digest: sha256:${{ needs.build_macos.outputs.artifact_sha256 }}

  build_macos_aarch64:
    runs-on: macos-14

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - uses: actions/checkout@v4.2.2

      - name: Build setup
        run: ./setup-build.sh
      
      - name: Build
        id: build
        run: ./build.sh
        
      - name: Upload Package
        uses: actions/upload-artifact@v4.5.0
        with:
          name: binary_package_macos_aarch64
          path: upload/*

      - name: Upload DOWNLOADS.txt
        uses: actions/upload-artifact@v4.5.0
        with:
          name: downloads-info-MacOS-AArch64
          path: DOWNLOADS.txt

      - name: Upload downloads
        uses: actions/upload-artifact@v4.5.0
        with:
          name: downloads-MacOS-AArch64
          path: downloads
        
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      artifact_sha256: ${{ steps.build.outputs.artifact_sha256 }}
      
  # Sign in a separate job to limit ID token exposure
  sign_macos_aarch64:
    needs: [build_macos_aarch64]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      
    steps:
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.build_macos_aarch64.outputs.artifact_name }}
          subject-digest: sha256:${{ needs.build_macos_aarch64.outputs.artifact_sha256 }}
